service: mi-api-users

provider:
  name: aws
  runtime: nodejs20.x
  stage: dev
  memorySize: 256

plugins:
  - serverless-offline

functions:
  createUser:
    handler: src/functions/createUser.handler
    events:
      - http:
          path: /users
          method: post

  listUsers:
    handler: src/functions/listUsers.handler
    events:
      - http:
          path: /users
          method: get

  getUser:
    handler: src/functions/getUser.handler
    events:
      - http:
          path: /users/{id}
          method: get


